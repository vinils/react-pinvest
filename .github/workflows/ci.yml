name: CI
on:
  schedule:
    # Runs every Monday at midnight UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      environment:
        description: 'Environment to deploy to'
        type: choice
        options:
        - development
        - staging
        - production
  push:
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
      - '*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
      - '*.md'
      - 'LICENSE'
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.run_number }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        platform: [ios, android]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      XCODE_VERSION: 26
      TURBO_CACHE_DIR: .turbo
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
      turbo_cache_hit: 0

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Restore dependencies
        id: yarn-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            **/node_modules
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('**/package.json', '!node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Cache dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            **/node_modules
            .yarn/install-state.gz
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck          

      - name: Build package
        run: yarn prepare

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

      - name: Build example for Web
        run: |
          yarn example build:web
        
      - name: Cache turborepo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}/${{ matrix.platform }}
          key: ${{ runner.os }}-turborepo-${{ matrix.platform }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-${{ matrix.platform }}-

      - name: Check turborepo cache
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:${{ matrix.platform }} --cache-dir="${{ env.TURBO_CACHE_DIR }}/${{ matrix.platform }}" --dry=json)).tasks.find(t => t.task === 'build:${{ matrix.platform }}').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Use appropriate Xcode version
        if: runner.os == 'macOS' && env.turbo_cache_hit != '1'
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install cocoapods
        if: runner.os == 'macOS' && env.turbo_cache_hit != 1 && steps.cocoapods-cache.outputs.cache-hit != 'true'
        run: |
          cd example
          bundle install
          bundle exec pod repo update --verbose
          bundle exec pod install --project-directory=${{ matrix.platform }}

      - name: Install JDK
        if: matrix.platform == 'android' && env.turbo_cache_hit != 1
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: matrix.platform == 'android' && env.turbo_cache_hit != 1
        run: |
          echo yes | "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager" --licenses
        shell: cmd

      - name: Cache Gradle
        if: matrix.platform == 'android' && env.turbo_cache_hit != 1
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        if: matrix.platform == 'android'
        run: chmod +x example/android/gradlew

      - name: Build example
        env:
          # This evaluates to the path on Windows, but remains completely empty/ignored on Linux
          LOCALAPPDATA: ${{ runner.os == 'Windows' && format('{0}/.mock_appdata', github.workspace) || '' }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        if: ${{ !((runner.os == 'Linux' || runner.os == 'Windows') && matrix.platform == 'ios') }}
        run: |
          yarn turbo run build:${{ matrix.platform }} --cache-dir="${{ env.TURBO_CACHE_DIR }}/${{ matrix.platform }}"
